[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root
loglevel=info

; Nginx faz o proxy da porta 8080 para os servicos internos
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; API FastAPI (porta interna 8000)
[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --limit-concurrency 50
directory=/app
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
environment=PYTHONUNBUFFERED=1,ENVIRONMENT=production,PORT=8000
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Dashboard Streamlit (porta 8501 - otimizado para memória)
[program:dashboard]
command=streamlit run app/dashboard.py --server.port=8501 --server.address=127.0.0.1 --logger.level=warning --client.showErrorDetails=false --server.maxUploadSize=5 --server.enableStaticServing=false --server.fileWatcherType none
directory=/app
autostart=true
autorestart=true
startsecs=30
stopasgroup=true
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app,STREAMLIT_SERVER_HEADLESS=true,STREAMLIT_BROWSER_GATHER_USAGE_STATS=false,STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
stdout_logfile=/tmp/dashboard.log
stderr_logfile=/tmp/dashboard_error.log
stdout_logfile_maxbytes=5242880
stderr_logfile_maxbytes=5242880

; MLflow DESABILITADO para economizar memória (512 MB limit)
; Use MLflow localmente ou em serviço separado
; [program:mlflow]
; command=mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri file:///app/mlruns --default-artifact-root file:///app/app/artifacts
; directory=/app
; autostart=false
; autorestart=false
