[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root
loglevel=info

; Nginx como reverse proxy para unificar /api, /dashboard e landing na porta 8080

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=30
stopasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; API FastAPI (porta interna)
[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --loop uvloop --limit-concurrency 50
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=10
priority=10
stopasgroup=true
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Dashboard Streamlit (porta interna)
[program:dashboard]
command=streamlit run app/dashboard.py --server.port=8501 --server.address=127.0.0.1 --server.baseUrlPath=/dashboard --logger.level=warning --client.showErrorDetails=true --server.maxUploadSize=5 --server.enableStaticServing=false
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=30
startretries=10
priority=20
stopasgroup=true
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app,STREAMLIT_SERVER_HEADLESS=true
stdout_logfile=/tmp/dashboard.log
stderr_logfile=/tmp/dashboard_error.log
stdout_logfile_maxbytes=5242880
stderr_logfile_maxbytes=5242880

; MLflow DESABILITADO para economizar memória (512 MB limit)
; Use MLflow localmente ou em serviço separado
; [program:mlflow]
; command=mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri file:///app/mlruns --default-artifact-root file:///app/app/artifacts
; directory=/app
; autostart=false
; autorestart=false
