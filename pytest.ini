[pytest]
# Pytest configuration file for the project

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration (comentado para Python 3.13)
# asyncio_mode = auto
# asyncio_default_fixture_loop_scope = function

# Test output options
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    -v
    --cov=src
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-fail-under=85

# Directories to test
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Testes unitários para funções/classes individuais
    integration: Testes de integração para funcionalidades combinadas
    slow: Testes que demoram tempo para executar
    gpu: Testes que requerem GPU
    skipif: Marca condicional para skip
    asyncio: Testes async que usam asyncio
    data_loading: Testes de carregamento de dados
    data_cleaning: Testes de limpeza de dados
    feature_engineering: Testes de feature engineering
    model_training: Testes de treinamento de modelo
    api: Testes de endpoints da API
    schemas: Testes de validação de schemas Pydantic
    dashboard: Testes do dashboard Streamlit

[coverage:run]
source = src,app
omit =
    */tests/*

    */site-packages/*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
precision = 2
skip_covered = False
skip_empty = True
show_missing = True

[coverage:html]
directory = htmlcov
