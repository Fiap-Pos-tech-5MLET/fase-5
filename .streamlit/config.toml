[theme]
primaryColor = "#7C3AED"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D29"
textColor = "#E2E8F0"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "error"

[browser]
gatherUsageStats = false

[server]
port = 8501
headless = true
baseUrlPath = "/dashboard"
enableCORS = false
enableXsrfProtection = false
