[theme]
primaryColor = "#7C3AED"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D29"
textColor = "#E2E8F0"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"
showSidebarNavigation = true
showMenuItems = false

[logger]
level = "error"

[browser]
gatherUsageStats = false

[server]
port = 8501
headless = true
baseUrlPath = "/dashboard"
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5
maxMessageSize = 50
runOnSave = false
fileWatcherType = "none"
enableStaticServing = false
enableWebsocketCompression = true
address = "127.0.0.1"

[runner]
magicEnabled = false
fastReruns = true
