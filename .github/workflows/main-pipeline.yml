name: 3. Main Pipeline

on:
  # Executa garantia final quando a release é mergeada na main
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: 3.0 Validação de Origem do PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Validar origem para PR em main
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "🔎 Validando política de origem para main..."
          echo "Base: ${BASE} | Head: ${HEAD}"

          if [[ "${BASE}" != "main" ]]; then
            echo "❌ Este workflow valida apenas PRs para main"
            exit 1
          fi

          if [[ "${HEAD}" == "develop" ]]; then
            echo "✅ Origem válida: ${HEAD} -> ${BASE}"
          else
            echo "❌ Origem inválida para main. O PR deve vir de develop"
            exit 1
          fi

  smoke-tests:
    name: 3.1 Testes de Sanidade (Smoke Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configurar Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        id: install-deps
        run: |
          echo "📦 Instalando dependências para smoke tests..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependências instaladas"

      - name: Validar importação e healthcheck da API
        id: smoke-check
        run: |
          echo "🚦 Executando smoke tests da API..."
          if ! python - <<'PY' 2>&1 | tee /tmp/smoke-check.log
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          health = client.get('/health')
          docs = client.get('/docs')

          assert health.status_code == 200, f'Healthcheck falhou: {health.status_code}'
          assert docs.status_code == 200, f'Docs falhou: {docs.status_code}'
          print('Smoke tests OK')
          PY
          then
            {
              echo "### ❌ Erro em Smoke Tests"
              echo '```text'
              tail -n 120 /tmp/smoke-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumo da etapa Smoke Tests
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🚦 Etapa: Smoke Tests (Main)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo ""
            echo "### Detalhamento"
            echo "- setup-python: ${{ steps.setup-python.outcome }}"
            echo "- install-deps: ${{ steps.install-deps.outcome }}"
            echo "- smoke-check: ${{ steps.smoke-check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: 3.2 Build da Imagem Docker
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build da imagem Docker
        id: docker-build
        run: |
          if ! docker build -f Dockerfile -t fase5-api:main . 2>&1 | tee /tmp/docker-build.log; then
            {
              echo "### ❌ Erro no Build Docker"
              echo '```text'
              tail -n 120 /tmp/docker-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumo da etapa Build Docker
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🐳 Etapa: Build Docker (Main)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo "- **Etapa crítica**: docker-build = ${{ steps.docker-build.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-render:
    name: 3.3 Deploy Contínuo no Render
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: docker-build
    timeout-minutes: 10

    steps:
      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Acionar Deploy Hook do Render
        id: render-deploy
        run: |
          if ! curl -s -S -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" 2>&1 | tee /tmp/render-deploy.log; then
            {
              echo "### ❌ Erro no Deploy Hook do Render"
              echo '```text'
              tail -n 120 /tmp/render-deploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumo da etapa Deploy
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🚀 Etapa: Deploy no Render (Main)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo "- **Etapa crítica**: render-deploy = ${{ steps.render-deploy.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  post-deploy-smoke:
    name: 3.4 Smoke Pós-Deploy (Predict)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: deploy-render
    timeout-minutes: 10

    steps:
      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validar endpoint /predict em produção
        id: prod-smoke
        env:
          RENDER_PUBLIC_URL: ${{ secrets.RENDER_PUBLIC_URL }}
        run: |
          BASE_URL="${RENDER_PUBLIC_URL}"
          if [ -z "${BASE_URL}" ]; then
            BASE_URL="https://datathon-machine-learning-engineering.onrender.com"
          fi

          echo "🌐 Base URL de produção: ${BASE_URL}"

          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/health" || true)
            if [[ "${STATUS}" == "200" ]]; then
              echo "✅ Healthcheck OK após deploy"
              break
            fi
            if [[ "${i}" == "20" ]]; then
              echo "❌ Healthcheck não ficou saudável a tempo"
              exit 1
            fi
            sleep 15
          done

          cat > /tmp/predict_payload.json <<'EOF'
          {
            "data": {
              "IDADE": 16,
              "FASE": "Fase 1 (3° e 4° ano)",
              "INDE_22": 6.5,
              "INDE_23": 7.1,
              "ANO_INGRESSO": 2022,
              "GÊNERO": "Feminino"
            }
          }
          EOF

          HTTP_CODE=$(curl -s -o /tmp/predict_response.json -w "%{http_code}" \
            -X POST "${BASE_URL}/api/predict" \
            -H "Content-Type: application/json" \
            -H "x-requested-by: ci_smoke_main" \
            --data @/tmp/predict_payload.json || true)

          echo "Predict HTTP status: ${HTTP_CODE}"
          cat /tmp/predict_response.json

          if [[ "${HTTP_CODE}" =~ ^5 ]]; then
            echo "❌ Predict retornou erro 5xx em produção"
            exit 1
          fi

      - name: Resumo da etapa Smoke Pós-Deploy
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🔬 Etapa: Smoke Pós-Deploy"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo "- **Etapa crítica**: prod-smoke = ${{ steps.prod-smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  auto-rollback:
    name: 3.5 Rollback Automático
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.post-deploy-smoke.result == 'failure'
    needs: [deploy-render, post-deploy-smoke]
    timeout-minutes: 10

    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Git para rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reverter commit atual da main
        id: rollback-commit
        run: |
          TARGET_SHA="${{ github.sha }}"
          PARENTS=$(git rev-list --parents -n 1 "${TARGET_SHA}" | awk '{print NF-1}')

          if [[ "${PARENTS}" -gt 1 ]]; then
            git revert -m 1 --no-edit "${TARGET_SHA}"
          else
            git revert --no-edit "${TARGET_SHA}"
          fi

      - name: Publicar rollback na main
        run: git push origin HEAD:main

      - name: Reacionar deploy no Render com commit de rollback
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -s -S -X POST "${RENDER_DEPLOY_HOOK_URL}" > /dev/null

      - name: Resumo do rollback
        if: always()
        run: |
          {
            echo "## ♻️ Rollback automático executado"
            echo "- Smoke pós-deploy falhou no endpoint /api/predict (erro 5xx)."
            echo "- Commit atual foi revertido em main e novo deploy foi acionado."
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: 3.6 Relatório do Pipeline
    runs-on: ubuntu-latest
    if: always()
    needs: [smoke-tests, docker-build, deploy-render, post-deploy-smoke, auto-rollback]
    timeout-minutes: 5

    steps:
      - name: Gerar relatório consolidado da Main
        run: |
          START_TIME=$(date +%s)
          SMOKE_STATUS="${{ needs.smoke-tests.result }}"
          DOCKER_STATUS="${{ needs.docker-build.result }}"
          DEPLOY_STATUS="${{ needs.deploy-render.result }}"
          PROD_SMOKE_STATUS="${{ needs.post-deploy-smoke.result }}"
          ROLLBACK_STATUS="${{ needs.auto-rollback.result }}"

          {
            echo "# 📊 Relatório do Pipeline - Main"
            echo ""
            echo "- **Branch**: \\`${{ github.ref_name }}\\`"
            echo "- **Commit**: \\`${{ github.sha }}\\`"
            echo "- **Autor**: ${{ github.actor }}"
            echo ""
            echo "## 📋 Resumo de Etapas"
            echo "| Etapa | Status |"
            echo "|-------|--------|"
            echo "| Smoke Tests | ${SMOKE_STATUS} |"
            echo "| Build Docker | ${DOCKER_STATUS} |"
            echo "| Deploy Render | ${DEPLOY_STATUS} |"
            echo "| Smoke Pós-Deploy | ${PROD_SMOKE_STATUS} |"
            echo "| Rollback Automático | ${ROLLBACK_STATUS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${SMOKE_STATUS}" != "success" || "${DOCKER_STATUS}" != "success" || "${DEPLOY_STATUS}" != "success" || "${PROD_SMOKE_STATUS}" == "failure" ]]; then
            {
              echo "## ❌ Falhas detectadas"
              echo "- Verifique a etapa com status diferente de \\`success\\` para saber onde ocorreu o erro."
              echo "- O log detalhado está no job correspondente."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ✅ Pipeline concluída com sucesso"
              echo "- Deploy em produção executado com sucesso no Render."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          END_TIME=$(date +%s)
          {
            echo ""
            echo "- **Duração da etapa de relatório**: $((END_TIME - START_TIME))s"
          } >> "$GITHUB_STEP_SUMMARY"
