name: 2. Develop Pipeline

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 2.1 Qualidade de Código (Ruff + MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configurar Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        id: install-deps
        run: |
          echo "📦 Instalando dependências de qualidade..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
          echo "✅ Dependências instaladas"

      - name: Verificar formatação com Ruff
        id: ruff-format
        run: |
          if ! ruff format --check app/ src/ tests/ scripts/ 2>&1 | tee /tmp/ruff-format.log; then
            {
              echo "### ❌ Erro em Ruff Format"
              echo '```text'
              tail -n 120 /tmp/ruff-format.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verificar lint com Ruff
        id: ruff-check
        run: |
          if ! ruff check app/ src/ tests/ scripts/ 2>&1 | tee /tmp/ruff-check.log; then
            {
              echo "### ❌ Erro em Ruff Check"
              echo '```text'
              tail -n 120 /tmp/ruff-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verificar tipos com MyPy
        id: mypy-check
        run: |
          if ! mypy src/ app/utils/ app/routes/ scripts/ --ignore-missing-imports 2>&1 | tee /tmp/mypy.log; then
            {
              echo "### ❌ Erro em MyPy"
              echo '```text'
              tail -n 120 /tmp/mypy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumo da etapa Qualidade
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🔎 Etapa: Qualidade de Código (Develop)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo ""
            echo "### Detalhamento"
            echo "- setup-python: ${{ steps.setup-python.outcome }}"
            echo "- install-deps: ${{ steps.install-deps.outcome }}"
            echo "- ruff-format: ${{ steps.ruff-format.outcome }}"
            echo "- ruff-check: ${{ steps.ruff-check.outcome }}"
            echo "- mypy-check: ${{ steps.mypy-check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: 2.2 Testes Completos com Coverage
    runs-on: ubuntu-latest
    # Paralelo ao Security: ambos dependem apenas de quality
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configurar Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        id: install-deps
        run: |
          echo "📦 Instalando dependências para testes completos..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          echo "✅ Dependências instaladas"

      - name: Executar suíte completa com coverage
        id: pytest-coverage
        run: |
          echo "🧪 Executando testes completos com coverage..."
          if ! pytest tests/ \
            --cov=app \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml 2>&1 | tee /tmp/pytest-coverage.log; then
            {
              echo "### ❌ Erro em Pytest + Coverage"
              echo '```text'
              tail -n 120 /tmp/pytest-coverage.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Testes e coverage concluídos"

      - name: Resumo da etapa Testes
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🧪 Etapa: Testes Completos (Develop)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo ""
            echo "### Detalhamento"
            echo "- setup-python: ${{ steps.setup-python.outcome }}"
            echo "- install-deps: ${{ steps.install-deps.outcome }}"
            echo "- pytest-coverage: ${{ steps.pytest-coverage.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: 2.3 Segurança (Bandit + Detect-Secrets)
    runs-on: ubuntu-latest
    # Paralelo ao Tests: ambos dependem apenas de quality
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configurar Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar ferramentas de segurança
        id: install-security-tools
        run: |
          echo "🔒 Instalando ferramentas de segurança..."
          python -m pip install --upgrade pip
          pip install bandit detect-secrets
          echo "✅ Ferramentas instaladas"

      - name: Executar Bandit
        id: bandit-check
        run: |
          if ! bandit -r app/ src/ 2>&1 | tee /tmp/bandit.log; then
            {
              echo "### ❌ Erro em Bandit"
              echo '```text'
              tail -n 120 /tmp/bandit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Executar Detect-Secrets
        id: detect-secrets-check
        run: |
          if ! detect-secrets scan --all-files > .secrets.scan 2>/tmp/detect-secrets.log; then
            {
              echo "### ❌ Erro em Detect-Secrets"
              echo '```text'
              tail -n 120 /tmp/detect-secrets.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! python - <<'PY' 2>&1 | tee /tmp/detect-secrets-validate.log
          import json

          with open('.secrets.scan', encoding='utf-8') as f:
              report = json.load(f)

          results = report.get('results', {})
          findings = sum(len(v) for v in results.values())

          if findings > 0:
              print(f'Foram detectados {findings} possíveis segredos no repositório.')
              for file_path, items in results.items():
                  if items:
                      print(f'- {file_path}: {len(items)} ocorrência(s)')
              raise SystemExit(1)

          print('Nenhum segredo detectado.')
          PY
          then
            {
              echo "### ❌ Detect-Secrets encontrou possíveis segredos"
              echo '```text'
              tail -n 120 /tmp/detect-secrets-validate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumo da etapa Segurança
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🔐 Etapa: Segurança (Develop)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo ""
            echo "### Detalhamento"
            echo "- setup-python: ${{ steps.setup-python.outcome }}"
            echo "- install-security-tools: ${{ steps.install-security-tools.outcome }}"
            echo "- bandit-check: ${{ steps.bandit-check.outcome }}"
            echo "- detect-secrets-check: ${{ steps.detect-secrets-check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: 2.4 Build Docker (Develop)
    runs-on: ubuntu-latest
    needs: [tests, security]
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build da imagem Docker
        id: docker-build
        run: |
          echo "🐳 Validando build da imagem Docker na develop..."
          if ! docker build -f Dockerfile -t fase5-api:develop . 2>&1 | tee /tmp/docker-build-develop.log; then
            {
              echo "### ❌ Erro no Build Docker (Develop)"
              echo '```text'
              tail -n 120 /tmp/docker-build-develop.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumo da etapa Docker
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🐳 Etapa: Build Docker (Develop)"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo "- **Etapa crítica**: docker-build = ${{ steps.docker-build.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  auto-release-pr:
    name: 2.5 Criar PR de release (develop -> main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [tests, security, docker-build]
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Registrar início da etapa
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verificar PR de release existente e criar se necessário
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr list --base main --head develop --state open --json number --jq '.[0].number' > /tmp/existing_release_pr.txt 2>/tmp/gh-pr-list.log; then
            {
              echo "### ❌ Erro ao listar PRs de release com gh"
              echo '```text'
              tail -n 120 /tmp/gh-pr-list.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          EXISTING_PR=$(cat /tmp/existing_release_pr.txt)
          if [ -n "${EXISTING_PR}" ] && [ "${EXISTING_PR}" != "null" ]; then
            echo "✅ PR develop -> main já existe: #${EXISTING_PR}"
            exit 0
          fi

          cat > /tmp/release_pr_body.md <<'EOF'
          ## Release para Produção

          Este PR foi criado automaticamente após validações completas da branch develop.

          ## Checklist de revisão

          - [ ] Lint rigoroso e type-check aprovados
          - [ ] Testes completos e coverage revisada
          - [ ] Verificações de segurança aprovadas
          - [ ] Release aprovada para merge em main
          EOF

          if ! gh pr create \
            --base main \
            --head develop \
            --title "🚀 Release: Atualização de Produção" \
            --body-file /tmp/release_pr_body.md 2>&1 | tee /tmp/gh-pr-create.log; then
            {
              echo "### ❌ Erro ao criar PR de release com gh"
              echo '```text'
              tail -n 120 /tmp/gh-pr-create.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ PR de release criado com sucesso"

      - name: Resumo da etapa Automação de Release
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - STAGE_START))
          {
            echo "## 🔀 Etapa: Automação de PR de Release"
            echo ""
            echo "- **Status geral**: ${{ job.status }}"
            echo "- **Duração**: ${DURATION}s"
            echo "- **Etapa crítica**: release-pr = ${{ steps.release-pr.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: 2.6 Relatório do Pipeline
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, tests, security, docker-build]
    timeout-minutes: 5

    steps:
      - name: Gerar relatório consolidado da Develop
        run: |
          START_TIME=$(date +%s)
          QUALITY_STATUS="${{ needs.quality.result }}"
          TESTS_STATUS="${{ needs.tests.result }}"
          SECURITY_STATUS="${{ needs.security.result }}"
          DOCKER_STATUS="${{ needs.docker-build.result }}"

          FAILED_STAGES=""
          if [[ "${QUALITY_STATUS}" != "success" ]]; then FAILED_STAGES="${FAILED_STAGES} Qualidade"; fi
          if [[ "${TESTS_STATUS}" != "success" ]]; then FAILED_STAGES="${FAILED_STAGES} Testes"; fi
          if [[ "${SECURITY_STATUS}" != "success" ]]; then FAILED_STAGES="${FAILED_STAGES} Segurança"; fi
          if [[ "${DOCKER_STATUS}" != "success" ]]; then FAILED_STAGES="${FAILED_STAGES} Docker"; fi

          {
            echo "# 📊 Relatório do Pipeline - Develop"
            echo ""
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Autor**: ${{ github.actor }}"
            echo ""
            echo "## 📦 Caixa 1 — Qualidade"
            echo "- **Status**: ${QUALITY_STATUS}"
            echo ""
            echo "## 📦 Caixa 2 — Testes"
            echo "- **Status**: ${TESTS_STATUS}"
            echo ""
            echo "## 📦 Caixa 3 — Segurança"
            echo "- **Status**: ${SECURITY_STATUS}"
            echo ""
            echo "## 📦 Caixa 4 — Docker"
            echo "- **Status**: ${DOCKER_STATUS}"
            echo ""
            echo "## 📋 Matriz de Status"
            echo "| Etapa | Status |"
            echo "|-------|--------|"
            echo "| Qualidade (Ruff/MyPy) | ${QUALITY_STATUS} |"
            echo "| Testes com Coverage | ${TESTS_STATUS} |"
            echo "| Segurança (Bandit/Detect-Secrets) | ${SECURITY_STATUS} |"
            echo "| Build Docker | ${DOCKER_STATUS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${QUALITY_STATUS}" != "success" || "${TESTS_STATUS}" != "success" || "${SECURITY_STATUS}" != "success" || "${DOCKER_STATUS}" != "success" ]]; then
            {
              echo "## ❌ Falhas detectadas"
              echo "- **Etapas com falha**:${FAILED_STAGES}"
              echo "- O erro detalhado foi publicado no summary do próprio job (bloco com stack/log)."
              echo "- O erro detalhado está no log do job correspondente."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ✅ Pipeline concluída com sucesso"
              echo "- Branch develop validada e release pronta para main."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          END_TIME=$(date +%s)
          {
            echo ""
            echo "- **Duração da etapa de relatório**: $((END_TIME - START_TIME))s"
          } >> "$GITHUB_STEP_SUMMARY"
