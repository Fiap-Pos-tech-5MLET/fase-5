services:
  - type: web
    name: Datathon - Machine Learning Engineering
    repo: https://github.com/Fiap-Pos-tech-5MLET/fase-5
    branch: main
    runtime: docker
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    region: virginia
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: production
      - key: API_URL
        value: https://datathon-machine-learning-engineering.onrender.com/api
      - key: MODEL_PATH
        value: /app/app/models/model.pkl
      - key: DATASET_PATH
        value: /app/app/data/raw/BASE DE DADOS PEDE 2024 - DATATHON.xlsx
      - key: ARTIFACTS_DIR
        value: /app/app/artifacts
      - key: KEEP_ALIVE_INTERVAL
        value: 600
      - key: MLFLOW_TRACKING_URI
        value: file:./mlruns
      - key: API_KEY
        sync: false
    healthCheckPath: /health