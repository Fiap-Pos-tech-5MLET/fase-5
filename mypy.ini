[mypy]
# Configuração global de mypy com validação rigorosa mas pragmática

python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
check_untyped_defs = True
strict_optional = True

# Ignorar packages sem tipos
ignore_missing_imports = True

# Per-module options
[mypy-app.utils.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-app.routes.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-app.models.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Permitir flexibilidade em dashboard (Streamlit é pouco tipado)
[mypy-app.dashboard.*]
ignore_errors = False
disallow_untyped_defs = False

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-lightgbm.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True
